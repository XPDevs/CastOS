<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <script src="js/device.js"></script>
  <title>Ambient</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/clock.css">
  <link rel="stylesheet" href="css/slideshow.css">
  <link rel="stylesheet" href="css/cast.css">
  <link rel="stylesheet" href="css/profile.css">
</head>
<body>
  <main class="stage">
    <img class="slide" id="slide-a" alt="">
    <img class="slide" id="slide-b" alt="">
  </main>

  <div class="clock">
    <span class="clock__time" id="clock-time">--:--</span>
    <span class="clock__date" id="clock-date"></span>
  </div>

  <div class="cast" id="cast" aria-hidden="true">
    <svg class="cast__icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
      <path fill="currentColor" d="M21 3H3c-1.1 0-2 .9-2 2v3h2V5h18v14h-7v2h7c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zM1 18v3h3c0-1.66-1.34-3-3-3zm0-4v2c2.76 0 5 2.24 5 5h2c0-3.87-3.13-7-7-7zm0-4v2c4.97 0 9 4.03 9 9h2c0-6.08-4.93-11-11-11z"/>
    </svg>
    <span class="cast__code" id="cast-code">000 0000 0000</span>
  </div>

  <div class="cast-panel" id="cast-panel" role="status" aria-live="polite" hidden>
    <div class="cast-card">
      <svg class="cast-card__icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <path fill="currentColor" d="M21 3H3c-1.1 0-2 .9-2 2v3h2V5h18v14h-7v2h7c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zM1 18v3h3c0-1.66-1.34-3-3-3zm0-4v2c2.76 0 5 2.24 5 5h2c0-3.87-3.13-7-7-7zm0-4v2c4.97 0 9 4.03 9 9h2c0-6.08-4.93-11-11-11z"/>
      </svg>
      <div class="cast-panel__eyebrow" id="cast-panel-eyebrow"></div>
      <div class="cast-panel__headline" id="cast-panel-headline"></div>
      <div class="cast-panel__sub" id="cast-panel-sub"></div>
    </div>
  </div>

  <script src="js/playlist.js"></script>
  <script src="js/clock.js"></script>
  <script src="js/slideshow.js"></script>
  <script src="js/cast.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
